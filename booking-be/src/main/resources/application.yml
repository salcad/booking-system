spring:
  application:
    name: booking-be
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/booking}
    username: ${DB_USER:booking}
    password: ${DB_PASSWORD:booking}
    hikari:
      maximum-pool-size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration

booking:
  # How long a PENDING_PAYMENT booking holds its seat before the reaper
  # releases it back to the pool.
  hold-duration: PT10M
  reaper-interval-ms: 30000
  trial-price-cents: 4900
  auth:
    # The shared password for the demo. Override in any real deployment.
    password: ${AUTH_PASSWORD:644k1n9}
    # Blank means a random key per boot: sessions end at restart and are not
    # shared between instances. Set AUTH_SECRET to keep them across either.
    secret: ${AUTH_SECRET:}
    session-duration: PT12H
    max-attempts: 10
    lockout-window: PT15M

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.ottodot.booking: DEBUG

server:
  port: 8074
